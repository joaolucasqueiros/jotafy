services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: metatrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metatrack_local}
      POSTGRES_DB: metatrack
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U metatrack']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
